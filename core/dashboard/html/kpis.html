<div class="kpi-grid" id="kpi-grid">
  <div class="kpi-card">
    <p class="kpi-label">Total alertas</p>
    <p class="kpi-value" id="kpi-total" style="color:#1A2C4E;">—</p>
    <p class="kpi-sub" style="color:#8A96A8;">este mes</p>
  </div>
  <div class="kpi-card">
    <p class="kpi-label">Urgentes</p>
    <p class="kpi-value" id="kpi-urgent" style="color:#D32F2F;">—</p>
    <p class="kpi-sub" style="color:#D32F2F;">vencen en 5 días</p>
  </div>
  <div class="kpi-card">
    <p class="kpi-label">Próximas</p>
    <p class="kpi-value" id="kpi-warning" style="color:#E67E00;">—</p>
    <p class="kpi-sub" style="color:#E67E00;">vencen en 15 días</p>
  </div>
  <div class="kpi-card">
    <p class="kpi-label">En plazo</p>
    <p class="kpi-value" id="kpi-ok" style="color:#2E7D32;">—</p>
    <p class="kpi-sub" style="color:#2E7D32;">vencen en 30 días</p>
  </div>
</div>
